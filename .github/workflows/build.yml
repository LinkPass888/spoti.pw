name: Build Tweak

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    runs-on: macos-14
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Theos
      uses: actions/checkout@v4
      with:
        repository: theos/theos
        path: theos
        submodules: recursive
        
    - name: Setup Theos SDK
      run: |
        if [ ! -d "$THEOS/sdks" ]; then
          git clone --depth=1 https://github.com/theos/sdks.git $THEOS/sdks
        fi
        
    - name: Install build dependencies
      run: |
        brew install make ldid dpkg
        
    - name: Generate empty SGFlagList.m
      run: |
        cat > tweak/src/SGFlagList.m << 'EOF'
#include "SGCommon.h"
const SGFlagDef SGFlagTable[] = {};
const NSUInteger SGFlagCount = 0;
EOF
        
    - name: Build tweak
      run: |
        gmake clean package
      env:
        FINALPACKAGE: 0
      working-directory: tweak
      
    - name: Upload dylib artifact
      uses: actions/upload-artifact@v4
      with:
        name: spotifyglass-tweak
        path: tweak/packages/*.deb
        retention-days: 7
